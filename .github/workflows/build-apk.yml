name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the APK as a GitHub Release"
        type: boolean
        default: true
  push:
    branches: [main, "arena/**"]
    paths:
      - "eplak/eplak-fixed/android-app/**"
      - "eplak/eplak-fixed/index.html"
      - "eplak/eplak-fixed/app.js"
      - "eplak/eplak-fixed/core/**"
      - "eplak/eplak-fixed/modules/**"
      - "eplak/eplak-fixed/views/**"
      - "eplak/eplak-fixed/assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

# Builds a signed release APK from eplak/eplak-fixed/android-app and publishes it as a GitHub Release.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: eplak/eplak-fixed/android-app
  APP_NAME: Eplak

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          # gradle-daemon-jvm.properties pins the daemon to an *Oracle* JDK 17.
          # CI provides Temurin 17, so drop the pin to avoid Gradle trying to
          # auto-provision a different JDK.
          rm -f gradle/gradle-daemon-jvm.properties
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Read version info from app/build.gradle
          VERSION_NAME=$(grep -E "^\s*versionName" app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+['\"]?([^'\"]+)['\"]?.*/\1/")
          VERSION_CODE=$(grep -E "^\s*versionCode" app/build.gradle | head -1 | sed -E "s/.*versionCode[[:space:]]+([0-9]+).*/\1/")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build release APK (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "ks_pass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_pass=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "signing=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found - signing with a temporary CI keystore. Add signing secrets for stable, upgradeable builds."
            keytool -genkeypair -v \
              -keystore "$KS" -storetype PKCS12 \
              -alias eplak -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass eplak-ci -keypass eplak-ci \
              -dname "CN=Eplak CI, OU=Eplak, O=Eplak, L=Varamin, C=IR"
            echo "ks_pass=eplak-ci" >> "$GITHUB_OUTPUT"
            echo "key_alias=eplak" >> "$GITHUB_OUTPUT"
            echo "key_pass=eplak-ci" >> "$GITHUB_OUTPUT"
            echo "signing=temporary" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Align and sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KS_PATH: ${{ steps.keystore.outputs.path }}
          KS_PASS: ${{ steps.keystore.outputs.ks_pass }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASS: ${{ steps.keystore.outputs.key_pass }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)
          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          OUT="$OUT_DIR/${APP_NAME}-v${VERSION_NAME}-release.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS_PATH" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT" | head -5
          (cd "$OUT_DIR" && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -lh "$OUT_DIR"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ steps.keystore.outputs.signing }}
        run: |
          set -euo pipefail
          TAG="android-v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}"
          TITLE="${APP_NAME} Android v${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})"
          # Builds from main are full "latest" releases; other branches are pre-releases.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            RELEASE_FLAGS="--latest"
          else
            RELEASE_FLAGS="--prerelease"
            TITLE="$TITLE – pre-release (${GITHUB_REF_NAME})"
          fi
          if [ "$SIGNING" = "secrets" ]; then
            SIGN_NOTE="امضا شده با کلید انتشار (secrets مخزن)."
          else
            SIGN_NOTE="⚠️ امضا شده با کلید موقت CI — برای نصب روی نسخه قبلی ممکن است لازم باشد ابتدا برنامه حذف شود. برای امضای پایدار، secrets مربوط به ANDROID_KEYSTORE_* را در مخزن تنظیم کنید."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## ای‌پلاک – نسخه اندروید ${VERSION_NAME} (versionCode ${VERSION_CODE})

          - فایل: \`$(basename "$APK_PATH")\`
          - شناسه بسته: \`com.example.eplakfixed\`
          - حداقل اندروید: ۷.۰ (API 24) — هدف: API 36
          - کامیت: \`${GITHUB_SHA}\` (شاخه \`${GITHUB_REF_NAME}\`)
          - ${SIGN_NOTE}

          ### نصب
          1. فایل APK را دانلود کنید.
          2. در تنظیمات گوشی اجازه‌ی «نصب از منابع ناشناس» را فعال کنید.
          3. فایل را باز کرده و نصب کنید.

          مجموع SHA-256 در فایل \`.sha256\` همراه APK قرار دارد.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $RELEASE_FLAGS
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
