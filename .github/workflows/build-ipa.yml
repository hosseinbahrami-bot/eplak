name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Xcode project
        run: |
          set -euo pipefail
          mkdir -p build-src
          ZIP=""
          for c in \
            "eplak/artifacts/eplak-ios-xcode.zip" \
            "artifacts/eplak-ios-xcode.zip"
          do
            [ -f "$c" ] && ZIP="$c" && break
          done
          test -n "$ZIP"
          echo "ZIP=$ZIP"
          unzip -q "$ZIP" -d build-src

      - name: Fix duplicate WKNavigationDelegate
        run: |
          find build-src -name ViewController.swift -exec \
            sed -i '' 's/extension ViewController: WKNavigationDelegate/extension ViewController/' {} +

      - name: Build app
        run: |
          xcodebuild \
            -project build-src/Eplak/Eplak.xcodeproj \
            -target Eplak \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/out"

      - name: Make real IPA
        run: |
          set -euo pipefail
          APP=$(find "$GITHUB_WORKSPACE/out" -name "Eplak.app" -type d | head -1)
          test -d "$APP"
          echo "APP=$APP"
          rm -rf Payload Eplak.ipa
          mkdir Payload
          cp -R "$APP" Payload/Eplak.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Eplak.ipa
          ls -lh Eplak.ipa
          file Eplak.ipa
          unzip -l Eplak.ipa | head -20

      - name: Put IPA on Releases (direct .ipa download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: Eplak IPA
          prerelease: true
          files: Eplak.ipa
          fail_on_unmatched_files: true
